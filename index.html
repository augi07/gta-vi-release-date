<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GTA 6 Countdown</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <style>
    :root {
      --accent: #34e3ff;
      --text-main: #fff;
      --text-muted: #c7c7c7;
      --font-main: system-ui, sans-serif;

      /* colores del blur-box que quitamos */
      --card-grad-1: rgba(255, 255, 255, 0.06);
      --card-grad-2: rgba(255, 255, 255, 0.01);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-glow-1: rgba(111, 66, 193, 0.18);
      --card-glow-2: rgba(52, 227, 255, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-main);
      color: var(--text-main);
      background: radial-gradient(circle at top, #171b2f, #050509 55%, #000);
    }

    /* ===== background ===== */
    .background-slider {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -2;
    }

    .slider-track {
      position: absolute;
      inset: 0;
      display: flex;
      width: 1000%;
      height: 100%;
      animation: slide-bg 140s linear infinite;
    }

    .slide { flex: 0 0 10%; }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.5) contrast(1.05);
      transform: scale(1.05);
    }

    @keyframes slide-bg {
      from { transform: translateX(0); }
      to   { transform: translateX(-90%); }
    }

    .dark-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background: radial-gradient(circle at top, rgba(0,0,0,.3), rgba(0,0,0,.85) 60%, #000);
    }

    /* ===== layout ===== */
    .content {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      text-align: center;
    }

    .gta-logo {
      height: 180px;
      object-fit: contain;
    }

    /* ===== time boxes w/ card-colors ===== */
    .countdown-grid {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .time-box {
      padding: 1.3rem 2.2rem;
      border-radius: 22px;

      /* mismo estilo del blur box que quitaste */
      background: linear-gradient(135deg, var(--card-grad-1), var(--card-grad-2));
      border: 1px solid var(--card-border);
      position: relative;

      box-shadow:
        0 25px 60px rgba(0,0,0,0.9),
        0 0 80px rgba(52,227,255,0.1);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .time-box::before {
        display: none;
    }

    .number {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-shadow: 0 0 20px rgba(0,0,0,.9);
    }

    .label {
      margin-top: .4rem;
      font-size: .8rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .badge {
      position: absolute;
      top: 8px;
      right: 12px;
      padding: 0.22rem 0.55rem;
      font-size: 0.65rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.8);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #ccc;
    }

    .footer-text {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- BG slider -->
  <div class="background-slider">
    <div class="slider-track">
      <div class="slide"><img src="assets/Image1.webp" /></div>
      <div class="slide"><img src="assets/Image2.jpg" /></div>
      <div class="slide"><img src="assets/Image3.webp" /></div>
      <div class="slide"><img src="assets/Image4.webp" /></div>
      <div class="slide"><img src="assets/Image5.webp" /></div>
      <div class="slide"><img src="assets/Image6.jpg" /></div>
      <div class="slide"><img src="assets/Image7.webp" /></div>
      <div class="slide"><img src="assets/Image8.webp" /></div>
      <div class="slide"><img src="assets/Image9.webp" /></div>
      <div class="slide"><img src="assets/Image10.webp" /></div>
    </div>
  </div>

  <div class="dark-vignette"></div>

  <div class="content">

    <img src="assets/GTA6Logo.webp" class="gta-logo" />

    <div class="countdown-grid">
      <div class="time-box">
        <span class="number" id="days">000</span>
        <span class="label">Days</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>

    <p class="footer-text">
      Visit the <a href="https://www.rockstargames.com/VI" target="_blank">official Rockstar Games website</a>
    </p>

  </div>

  <script>
    const releaseDate = new Date("2026-11-19T00:00:00");
    const startDate = new Date();

    const d = document.getElementById("days");
    const h = document.getElementById("hours");
    const m = document.getElementById("minutes");
    const s = document.getElementById("seconds");

    const pad = (n, size=2) => String(n).padStart(size, "0");

    function update() {
      const now = new Date();
      let diff = releaseDate - now;

      if (diff <= 0) diff = 0;

      const total = Math.floor(diff / 1000);
      const days = Math.floor(total / 86400);
      const hours = Math.floor((total % 86400) / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;

      d.textContent = pad(days, 3);
      h.textContent = pad(hours);
      m.textContent = pad(minutes);
      s.textContent = pad(seconds);
    }

    update();
    setInterval(update, 1000);
  </script>

</body>
</html>
