<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090611" />
  <meta name="description" content="Countdown to the release of Grand Theft Auto VI." />
  <title>GTA VI — Release Countdown</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <style>
    :root {
      --pink: #ff4fa3;
      --orange: #ff9f45;
      --cyan: #58e4ff;
      --text: #fffafc;
      --muted: rgba(255, 250, 252, .68);
      --glass: rgba(18, 12, 27, .52);
      --border: rgba(255, 255, 255, .16);
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      font-family: var(--font);
      color: var(--text);
      background: #090611;
    }

    .background-slider,
    .background-slide,
    .atmosphere {
      position: fixed;
      inset: 0;
    }

    .background-slider { z-index: -3; overflow: hidden; background: #090611; }

    .background-slide {
      opacity: 0;
      background-position: center;
      background-size: cover;
      animation: crossfade 80s ease-in-out infinite, drift 16s ease-in-out infinite alternate;
      will-change: opacity, transform;
    }

    .background-slide:nth-child(1)  { background-image: url("assets/Image1.webp");  animation-delay: 0s, 0s; }
    .background-slide:nth-child(2)  { background-image: url("assets/Image2.jpg");   animation-delay: 8s, -3s; }
    .background-slide:nth-child(3)  { background-image: url("assets/Image3.webp");  animation-delay: 16s, -6s; }
    .background-slide:nth-child(4)  { background-image: url("assets/Image4.webp");  animation-delay: 24s, -9s; }
    .background-slide:nth-child(5)  { background-image: url("assets/Image5.webp");  animation-delay: 32s, -12s; }
    .background-slide:nth-child(6)  { background-image: url("assets/Image6.jpg");   animation-delay: 40s, -15s; }
    .background-slide:nth-child(7)  { background-image: url("assets/Image7.webp");  animation-delay: 48s, -2s; }
    .background-slide:nth-child(8)  { background-image: url("assets/Image8.webp");  animation-delay: 56s, -5s; }
    .background-slide:nth-child(9)  { background-image: url("assets/Image9.webp");  animation-delay: 64s, -8s; }
    .background-slide:nth-child(10) { background-image: url("assets/Image10.webp"); animation-delay: 72s, -11s; }

    @keyframes crossfade {
      0% { opacity: 0; }
      2.5%, 10% { opacity: 1; }
      12.5%, 100% { opacity: 0; }
    }

    @keyframes drift {
      from { transform: scale(1.04) translate3d(-.4%, 0, 0); }
      to { transform: scale(1.1) translate3d(.4%, -.4%, 0); }
    }

    .atmosphere {
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(8, 4, 15, .22), rgba(8, 4, 15, .7)),
        radial-gradient(circle at 50% 38%, transparent 0, rgba(3, 2, 8, .18) 42%, rgba(3, 2, 8, .78) 100%);
    }

    .content {
      width: min(1100px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(2rem, 5vw, 4.5rem) 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.4rem, 3vw, 2.4rem);
      text-align: center;
    }

    .hero { animation: enter .9s cubic-bezier(.2, .8, .2, 1) both; }

    .eyebrow {
      margin-bottom: .65rem;
      color: rgba(255,255,255,.8);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .32em;
      text-transform: uppercase;
    }

    .gta-logo {
      display: block;
      width: clamp(230px, 38vw, 440px);
      height: auto;
      margin: 0 auto;
      filter: drop-shadow(0 22px 34px rgba(0,0,0,.48)) drop-shadow(0 0 42px rgba(255,79,163,.14));
      transition: transform .5s cubic-bezier(.2,.8,.2,1), filter .5s ease;
    }

    .gta-logo:hover {
      transform: translateY(-5px) scale(1.025);
      filter: drop-shadow(0 28px 38px rgba(0,0,0,.55)) drop-shadow(0 0 52px rgba(255,79,163,.25));
    }

    .release-line {
      margin-top: .75rem;
      color: var(--muted);
      font-size: clamp(.8rem, 1.8vw, .95rem);
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .countdown-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(135px, 1fr));
      gap: clamp(.7rem, 1.6vw, 1.1rem);
      animation: enter .9s .12s cubic-bezier(.2,.8,.2,1) both;
    }

    .time-box {
      position: relative;
      isolation: isolate;
      min-height: 148px;
      padding: 1.5rem 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: linear-gradient(145deg, rgba(255,255,255,.13), var(--glass) 58%, rgba(255,255,255,.05));
      box-shadow: 0 22px 55px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.14);
      backdrop-filter: blur(20px) saturate(135%);
      -webkit-backdrop-filter: blur(20px) saturate(135%);
      transition: transform .35s ease, border-color .35s ease, box-shadow .35s ease;
    }

    .time-box::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 110px;
      height: 110px;
      top: -72px;
      left: 50%;
      border-radius: 50%;
      background: var(--pink);
      filter: blur(42px);
      opacity: .28;
      transform: translateX(-50%);
    }

    .time-box:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,.3);
      box-shadow: 0 30px 70px rgba(0,0,0,.4), 0 0 36px rgba(255,79,163,.1), inset 0 1px 0 rgba(255,255,255,.2);
    }

    .number {
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.6rem, 6vw, 4.4rem);
      font-weight: 750;
      line-height: .95;
      letter-spacing: -.045em;
      text-shadow: 0 7px 24px rgba(0,0,0,.38);
    }

    .number.tick { animation: tick .48s cubic-bezier(.2,.8,.2,1); }

    .label {
      margin-top: .8rem;
      color: var(--muted);
      font-size: .67rem;
      font-weight: 700;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .official-link {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      padding: .82rem 1.18rem;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      color: var(--text);
      background: rgba(10, 6, 16, .5);
      box-shadow: 0 12px 30px rgba(0,0,0,.22);
      backdrop-filter: blur(14px);
      font-size: .82rem;
      font-weight: 650;
      text-decoration: none;
      transition: transform .3s ease, background .3s ease, border-color .3s ease, box-shadow .3s ease;
      animation: enter .9s .24s cubic-bezier(.2,.8,.2,1) both;
    }

    .official-link svg {
      width: 1.05rem;
      height: 1.05rem;
      flex: 0 0 auto;
      color: #fff;
      transition: transform .3s ease;
    }
    .official-link:hover { transform: translateY(-3px); background: rgba(255,79,163,.16); border-color: rgba(255,125,187,.5); box-shadow: 0 16px 35px rgba(0,0,0,.3); }
    .official-link:hover svg { transform: translateX(4px); }
    .official-link:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; }

    @keyframes tick {
      0% { opacity: .35; transform: translateY(-9px) scale(.96); filter: blur(2px); }
      100% { opacity: 1; transform: none; filter: blur(0); }
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 700px) {
      .content { justify-content: center; padding-block: 1.5rem; gap: 1.35rem; }
      .countdown-grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); max-width: 520px; }
      .time-box { min-height: 112px; padding: 1.15rem .75rem 1rem; border-radius: 21px; }
      .label { margin-top: .55rem; }
    }

    @media (max-width: 380px) {
      .content { padding-inline: .8rem; }
      .countdown-grid { gap: .55rem; }
      .time-box { min-height: 102px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .background-slide:first-child { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="background-slider" aria-hidden="true">
    <div class="background-slide"></div><div class="background-slide"></div>
    <div class="background-slide"></div><div class="background-slide"></div>
    <div class="background-slide"></div><div class="background-slide"></div>
    <div class="background-slide"></div><div class="background-slide"></div>
    <div class="background-slide"></div><div class="background-slide"></div>
  </div>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="content">
    <header class="hero">
      <p class="eyebrow">The countdown is on</p>
      <img src="assets/GTA6Logo.webp" class="gta-logo" alt="Grand Theft Auto VI" />
      <p class="release-line">Coming November 19, 2026</p>
    </header>

    <section class="countdown-grid" aria-label="Time until release" aria-live="polite">
      <div class="time-box"><span class="number" id="days">000</span><span class="label">Days</span></div>
      <div class="time-box"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
      <div class="time-box"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
      <div class="time-box"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
    </section>

    <a class="official-link" href="https://www.rockstargames.com/VI" target="_blank" rel="noopener noreferrer">
      Visit the official Rockstar Games website
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
  </main>

  <script>
    const releaseDate = new Date("2026-11-19T00:00:00");
    const elements = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };
    const previous = {};
    const pad = (value, size = 2) => String(value).padStart(size, "0");

    function setValue(name, value) {
      if (previous[name] === value) return;
      const element = elements[name];
      element.textContent = value;
      element.classList.remove("tick");
      void element.offsetWidth;
      element.classList.add("tick");
      previous[name] = value;
    }

    function updateCountdown() {
      const difference = Math.max(0, releaseDate.getTime() - Date.now());
      const totalSeconds = Math.floor(difference / 1000);

      setValue("days", pad(Math.floor(totalSeconds / 86400), 3));
      setValue("hours", pad(Math.floor((totalSeconds % 86400) / 3600)));
      setValue("minutes", pad(Math.floor((totalSeconds % 3600) / 60)));
      setValue("seconds", pad(totalSeconds % 60));
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
